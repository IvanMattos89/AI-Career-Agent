name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate clean installation
        run: |
          python -m pip check
          python -m compileall -q app
          python -c "from app.main import main; from app.database.sqlite_db import Database; db = Database(); db.close(); print('clean install ok')"

      - name: Ruff
        run: python -m ruff check .

      - name: MyPy
        run: python -m mypy app

      - name: Pytest
        run: python -m pytest --cov=app --cov-report=term --cov-fail-under=70
