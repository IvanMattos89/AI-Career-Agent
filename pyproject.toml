[project]
name = "ai-career-agent"
version = "3.2.0"
description = "Assistente desktop para análise de currículo, busca de vagas e gestão de carreira."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "IvanMattos89" }]
dependencies = [
    "PySide6>=6.8,<7",
    "python-docx>=1.1,<2",
    "pypdf>=5,<7",
    "openai>=1.50,<3",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "reportlab>=4,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I"]
ignore = ["F403", "F405"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
follow_imports = "skip"
